name: frontend
description: "A-Powered IELTS and PTE Preparation Frontend Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  fl_chart: ^0.70.2
  provider: ^6.1.1
  share_plus: ^13.1.0
  http: ^1.2.0
  multicast_dns: ^0.3.3
  shared_preferences: ^2.5.5 # Cleaned and structured correctly here
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.2
  socket_io_client: ^3.0.2
  intl: ^0.20.2
  # Pin 6.2.1: last 6.x with matching record_linux / record_platform_interface (7.x needs Dart 3.12).
  record: 6.2.1
  permission_handler: ^11.4.0
  audioplayers: ^6.1.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700